# Pondhouse custom Hyprland bindings.
#
# Keep Omarchy defaults in bindings.conf. Put company-level overrides here,
# defensively unbinding each key before binding it again to avoid duplicate binds
# when upstream changes defaults.

# Application bindings
unbind = SUPER, E
bindd = SUPER, E, File manager, exec, uwsm-app -- nautilus --new-window

unbind = SUPER, B
bindd = SUPER, B, Browser, exec, omarchy-launch-browser

unbind = SUPER SHIFT, T
bindd = SUPER SHIFT, T, Teams, exec, ~/.local/share/omarchy/bin/start-teams.sh

# Screenshots
unbind = SUPER SHIFT, S
bindd = SUPER SHIFT, S, Screenshot of region, exec, ~/.local/share/omarchy/bin/omarchy-cmd-screenshot

unbind = SHIFT, PRINT
bindd = SHIFT, PRINT, Screenshot of window, exec, ~/.local/share/omarchy/bin/omarchy-cmd-screenshot window

unbind = CTRL, PRINT
bindd = CTRL, PRINT, Screenshot of display, exec, ~/.local/share/omarchy/bin/omarchy-cmd-screenshot output

# Screen recording
unbind = SUPER CTRL, S
bindd = SUPER CTRL, S, Screen record a region, exec, omarchy-menu screenrecord

unbind = SUPER CTRL SHIFT, S
bindd = SUPER CTRL SHIFT, S, Screen record a region with audio, exec, ~/.local/share/omarchy/bin/omarchy-cmd-screenrecord region

# Color picker
unbind = SUPER, F11
bindd = SUPER, F11, Color picker, exec, pkill hyprpicker || hyprpicker -a

# Control tiling
unbind = SUPER SHIFT, U
bindd = SUPER SHIFT, U, Toggle split, togglesplit, # dwindle

unbind = SUPER, F
bindd = SUPER, F, Force full screen, fullscreen, 0

# Move focus with SUPER + VIM keys
unbind = SUPER, H
bindd = SUPER, h, Move focus left, movefocus, l

unbind = SUPER, L
bindd = SUPER, l, Move focus right, movefocus, r

unbind = SUPER, J
bindd = SUPER, j, Move focus down, movefocus, d

unbind = SUPER, K
bindd = SUPER, k, Move focus up, movefocus, u

# Swap active window with SUPER + SHIFT + VIM keys
unbind = SUPER SHIFT, H
bindd = SUPER SHIFT, H, Swap window to the left, swapwindow, l

unbind = SUPER SHIFT, L
bindd = SUPER SHIFT, L, Swap window to the right, swapwindow, r

unbind = SUPER SHIFT, J
bindd = SUPER SHIFT, J, Swap window down, swapwindow, d

unbind = SUPER SHIFT, K
bindd = SUPER SHIFT, K, Swap window up, swapwindow, u

# Move active window with SUPER + CTRL + VIM keys
unbind = SUPER CTRL, H
bindd = SUPER CTRL, H, Move Window left, movewindow, l

unbind = SUPER CTRL, L
bindd = SUPER CTRL, L, Move Window right, movewindow, r

unbind = SUPER CTRL, J
bindd = SUPER CTRL, J, Move Window down, movewindow, d

unbind = SUPER CTRL, K
bindd = SUPER CTRL, K, Move Window up, movewindow, u

# Move current workspace to monitor with SUPER + SHIFT + A/F
unbind = SUPER SHIFT, A
bindd = SUPER SHIFT, A, Move current workspace to monitor left, movecurrentworkspacetomonitor, l

unbind = SUPER SHIFT, F
bindd = SUPER SHIFT, F, Move current workspace to monitor right, movecurrentworkspacetomonitor, r

unbind = SUPER SHIFT, B
bindd = SUPER SHIFT, B, Show key bindings, exec, omarchy-menu-keybindings
