onboarding = false

[terminal]
default_shell = "zsh"
new_cwd = "follow"

[keys]
prefix = "ctrl+b"
detach = "prefix+d"
reload_config = "prefix+r"

# Panes
split_vertical = ["prefix+percent", "prefix+v"]
split_horizontal = ["prefix+double_quote", "prefix+minus"]
close_pane = ""
focus_pane_left = ["prefix+h", "ctrl+alt+left"]
focus_pane_down = ["prefix+j", "ctrl+alt+down"]
focus_pane_up = ["prefix+k", "ctrl+alt+up"]
focus_pane_right = ["prefix+l", "ctrl+alt+right"]
resize_mode = "prefix+alt+r"

# Tabs (tmux windows)
new_tab = "prefix+c"
close_tab = "prefix+shift+x"
rename_tab = "prefix+comma"
previous_tab = ["prefix+p", "alt+left"]
next_tab = ["prefix+n", "alt+right"]
switch_tab = ["prefix+1..9", "alt+1..9"]

# Workspaces (tmux sessions)
new_workspace = "prefix+shift+c"
close_workspace = "prefix+shift+k"
rename_workspace = "prefix+$"
previous_workspace = ["prefix+shift+p", "alt+up"]
next_workspace = ["prefix+shift+n", "alt+down"]

[[keys.command]]
key = "prefix+x"
type = "popup"
command = "$HOME/scripts/herdr-kill-pane.sh"
description = "close pane with confirmation"
width = 42
height = 5

[[keys.command]]
key = "prefix+H"
type = "popup"
command = "$HOME/scripts/herdr-cht.sh"
description = "open cheat sheet"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "$HOME/scripts/herdr-tldr.sh"
description = "open tldr"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+W"
type = "popup"
command = "$HOME/scripts/herdr-windowizer.sh"
description = "find or create tab"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+S"
type = "popup"
command = "$HOME/scripts/herdr-sessionizer.sh"
description = "find or create workspace"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "toggle reviewr sidebar"

[[keys.command]]
key = "alt+minus"
type = "shell"
command = "$HERDR_BIN_PATH pane resize --direction left --pane \"$HERDR_ACTIVE_PANE_ID\""
description = "resize pane left"

[[keys.command]]
key = "alt+plus"
type = "shell"
command = "$HERDR_BIN_PATH pane resize --direction down --pane \"$HERDR_ACTIVE_PANE_ID\""
description = "resize pane down"

[[keys.command]]
key = "alt+_"
type = "shell"
command = "$HERDR_BIN_PATH pane resize --direction up --pane \"$HERDR_ACTIVE_PANE_ID\""
description = "resize pane up"

[[keys.command]]
key = "alt+="
type = "shell"
command = "$HERDR_BIN_PATH pane resize --direction right --pane \"$HERDR_ACTIVE_PANE_ID\""
description = "resize pane right"

[[keys.command]]
key = "alt+shift+left"
type = "shell"
command = "$HOME/scripts/herdr-move-tab.sh left"
description = "move tab left"

[[keys.command]]
key = "alt+shift+right"
type = "shell"
command = "$HOME/scripts/herdr-move-tab.sh right"
description = "move tab right"

[ui]
agent_panel_sort = "spaces"
confirm_close = true
pane_gaps = false
prompt_new_tab_name = false

[ui.toast]
delivery = "system"
delay_seconds = 1

[theme]
name = "terminal"

[advanced]
scrollback_limit_bytes = 10000000
